services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/garden_db?sslmode=disable
      - ZITADEL_ISSUER=http://zitadel:8080
      - ZITADEL_PROJECT_ID=${ZITADEL_PROJECT_ID}
      - HUB_SERVICE_ACCOUNT_ID=${HUB_SERVICE_ACCOUNT_ID}
    depends_on:
      db:
        condition: service_healthy
      zitadel:
        condition: service_healthy

  db:
    image: timescale/timescaledb:latest-pg14
    environment:
      POSTGRES_DB: garden_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/01-garden.sql
      - ./zitadel-init.sql:/docker-entrypoint-initdb.d/00-zitadel.sql
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d garden_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  zitadel:
    image: ghcr.io/zitadel/zitadel:latest
    command: 'start-from-init --masterkeyFromEnv --tlsMode disabled'
    environment:
      - ZITADEL_DATABASE_POSTGRES_HOST=db
      - ZITADEL_DATABASE_POSTGRES_PORT=5432
      - ZITADEL_DATABASE_POSTGRES_DATABASE=zitadel_db
      - ZITADEL_DATABASE_POSTGRES_USER_USERNAME=user
      - ZITADEL_DATABASE_POSTGRES_USER_PASSWORD=password
      - ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE=disable
      - ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME=user
      - ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD=password
      - ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE=disable
      - ZITADEL_MASTERKEY=${ZITADEL_MASTERKEY}
      - ZITADEL_EXTERNALSECURE=false
      - ZITADEL_EXTERNALPORT=8085
      - ZITADEL_EXTERNALDOMAIN=localhost
    ports:
      - "8085:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  swagger-ui:
    image: swaggerapi/swagger-ui
    ports:
      - "8081:8080"
    environment:
      - SWAGGER_JSON=/docs/api.swagger.json
    volumes:
      - ./gen/openapiv2:/docs
    depends_on:
      - api

volumes:
  timescale_data:
