services:
    api:
        build: .
        # ports:
        #     - "8080:8080"
        environment:
            - DATABASE_URL=${DATABASE_URL}
            - JWT_KEY_PATH=${JWT_KEY_PATH:-.}
            - MISTRAL_API_KEY=${MISTRAL_API_KEY}
            - MISTRAL_AGENT_ID=${MISTRAL_AGENT_ID}
            - MISTRAL_AGENT_VERSION=${MISTRAL_AGENT_VERSION:-1}
            - MISTRAL_BASE_URL=${MISTRAL_BASE_URL:-}
        extra_hosts:
            - "localhost:host-gateway"
        depends_on:
            db:
                condition: service_healthy
        networks:
            - harvest-hub

    db:
        restart: unless-stopped
        image: timescale/timescaledb:latest-pg17
        environment:
            PGUSER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB:-garden_db}
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -d ${POSTGRES_DB:-garden_db} -U ${POSTGRES_USER:-postgres}
            interval: 10s
            timeout: 30s
            retries: 5
            start_period: 20s
        # ports:
        #     - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./db:/docker-entrypoint-initdb.d
        networks:
            - harvest-hub

networks:
    harvest-hub:

volumes:
    postgres_data:
